version: 2

models:
  - name: stg_facebook_ads_stats
    description: "Cleaned, cast, and standardized daily performance metrics from raw Facebook Ads."
    
    # Model-level configurations can also be set here if needed
    config:
      materialized: view

    columns:
      - name: ad_id
        description: "The unique primary key generated by Facebook for this individual advertisement."
        tests:
          - not_null

      - name: account_id
        description: "The id which shows the accounts associated with each id."
        tests:
          - not_null

      - name: spend
        description: "The daily total cost spent running this ad campaign."
        tests:
          - not_null

      - name: ad_date
        description: "The calendar date when the performance activity occurred."
        tests:
          - not_null

      - name: ad_click
        description: "The cumulative count of unique link clicks recorded."

      - name: ad_impressions
        description: "The cumulative count of unique impressions on ads recorded recorded."



